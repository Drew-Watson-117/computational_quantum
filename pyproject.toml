[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-net"
version = "0.1.0"
description = "Physics-informed neural network utilities for exploratory quantum mechanics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name="Drew Watson"}
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "torch>=2.2,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6"
]

[project.scripts]
psi-net = "psi_net.cli:main"

[tool.setuptools.packages.find]
include = ["psi_net*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
